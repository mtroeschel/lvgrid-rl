[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lvgrid-rl"
version = "0.1.0.dev0"
description = "Trainingsumgebung fuer RL-Agenten zur autonomen Regelung von Niederspannungsnetzen"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "TODO Vorname Nachname" }]
keywords = [
  "reinforcement-learning",
  "power-systems",
  "low-voltage-grid",
  "pandapower",
  "simbench",
  "voltage-control",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
# From M1 onwards. Deliberately not installed in M0, so that the skeleton and the
# invariant tests run without heavy dependencies.
sim = [
  "pandas>=2.1",
  "pyarrow>=15",
  "pandapower>=2.14",
  # >=1.6.2 on purpose: earlier releases leave the ZIP load model columns
  # undefined, which makes the pandapower 3.x Jacobian singular so that no
  # low-voltage grid converges, and they suppress a pandas FutureWarning only
  # for pandas 2.2.x exactly. Both are fixed in 1.6.2. Verified that the data is
  # unchanged: identical profile content hash, net and connection points.
  "simbench>=1.6.2",
]
# Split out from `rl` on purpose: the environment needs only Gymnasium, which is
# small, whereas `rl` pulls in PyTorch. CI can therefore test the environment
# without installing a deep learning stack.
env = ["gymnasium>=0.29"]
# Static plots for the results report (architecture section 9.4). Kept out of
# the core so that a training machine need not carry a plotting stack.
viz = ["matplotlib>=3.8"]
rl = [
  "lvgrid-rl[env]",
  "stable-baselines3>=2.3",
  "sb3-contrib>=2.3",
  "torch>=2.2",
  # Stable-Baselines3 raises rather than degrading when a tensorboard_log
  # directory is configured without tensorboard installed, so it belongs in the
  # extra rather than in a "nice to have" list.
  "tensorboard>=2.16",
]

# Note for CPU-only machines: the PyPI torch wheel for Linux bundles the CUDA
# runtime and pulls several gigabytes of nvidia packages. A CPU-only install is
# available from the PyTorch index; see
# https://docs.astral.sh/uv/guides/integration/pytorch/ for the uv configuration.
config = ["hydra-core>=1.3", "omegaconf>=2.3"]

[project.urls]
Repository = "https://github.com/mtroeschel/lvgrid-rl"
Issues = "https://github.com/mtroeschel/lvgrid-rl/issues"

# Entwicklungsabhaengigkeiten als Dependency Group nach PEP 735, nicht als
# Extra. Der Unterschied ist praktisch entscheidend: `uv sync` und `uv run`
# installieren die Gruppe `dev` standardmaessig, ein Extra dagegen nur mit
# explizitem `--extra dev`. Lag pytest nur im Extra, griff `uv run pytest` auf
# ein pytest aus dem System-PATH zurueck, das mit dem System-Interpreter laeuft
# und die Pakete der virtuellen Umgebung nicht sieht.
# ruff ist exakt gepinnt und mit rev in .pre-commit-config.yaml identisch.
[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov",
  "ruff==0.16.7",
  "mypy>=1.10",
  "pre-commit>=3.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lvgrid_rl"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--strict-markers --doctest-modules"
markers = [
  "invariant: prueft eine Invariante des Erweiterbarkeits-Contracts (Abschnitt 13)",
]
filterwarnings = [
  "error::DeprecationWarning",
  # Stammt aus pandas-Interna beim Bilden von Timedelta-Differenzen, nicht aus
  # unserem Code. Gezielt gefiltert statt pauschal alle Warnungen stummzuschalten.
  "default:The 'generic' unit for NumPy timedelta is deprecated:DeprecationWarning",
  # simbench nutzt beim Zusammenfuehren leerer Tabellen eine veraltete
  # pandas-Konkatenation.
  "default::FutureWarning:simbench.*",
  "default::FutureWarning:pandapower.*",
]

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
# D203/D213: widerspruechliche Einrueckungsregeln, von der Google-Konvention
#   ohnehin ausgeschlossen.
# D105/D107: Dunder- und __post_init__-Methoden. Ihre Semantik ist durch die
#   Sprache festgelegt; ein erzwungener Docstring erzeugt dort Rauschen. Die
#   Begruendung der Validierungslogik steht im Docstring der jeweiligen Klasse.
ignore = ["D203", "D213", "D105", "D107"]

[tool.ruff.lint.per-file-ignores]
# In Tests ist der Funktionsname die Dokumentation; ein Docstring je Testfunktion
# waere Verdopplung. Die Formatregeln D205/D209 bleiben aktiv, damit vorhandene
# Docstrings einheitlich bleiben.
"tests/**" = ["D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/lvgrid_rl"]
