[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lvgrid-rl"
version = "0.1.0.dev0"
description = "Trainingsumgebung fuer RL-Agenten zur autonomen Regelung von Niederspannungsnetzen"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "TODO Vorname Nachname" }]
keywords = [
  "reinforcement-learning",
  "power-systems",
  "low-voltage-grid",
  "pandapower",
  "simbench",
  "voltage-control",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
# M1 aufwaerts. In M0 absichtlich nicht installiert, damit das Skelett und die
# Invariantentests ohne schwere Abhaengigkeiten laufen.
sim = [
  "pandas>=2.1",
  "pyarrow>=15",
  "pandapower>=2.14",
  "simbench>=1.6",
]
rl = [
  "gymnasium>=0.29",
  "stable-baselines3>=2.3",
  "sb3-contrib>=2.3",
  "torch>=2.2",
]
config = ["hydra-core>=1.3", "omegaconf>=2.3"]
dev = ["pytest>=8", "pytest-cov", "ruff>=0.4", "mypy>=1.10"]

[project.urls]
Repository = "https://github.com/mtroeschel/lvgrid-rl"
Issues = "https://github.com/mtroeschel/lvgrid-rl/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/lvgrid_rl"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--strict-markers --doctest-modules"
markers = [
  "invariant: prueft eine Invariante des Erweiterbarkeits-Contracts (Abschnitt 13)",
]

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
# D203/D213: widerspruechliche Einrueckungsregeln, von der Google-Konvention
#   ohnehin ausgeschlossen.
# D105/D107: Dunder- und __post_init__-Methoden. Ihre Semantik ist durch die
#   Sprache festgelegt; ein erzwungener Docstring erzeugt dort Rauschen. Die
#   Begruendung der Validierungslogik steht im Docstring der jeweiligen Klasse.
ignore = ["D203", "D213", "D105", "D107"]

[tool.ruff.lint.per-file-ignores]
# In Tests ist der Funktionsname die Dokumentation; ein Docstring je Testfunktion
# waere Verdopplung. Die Formatregeln D205/D209 bleiben aktiv, damit vorhandene
# Docstrings einheitlich bleiben.
"tests/**" = ["D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/lvgrid_rl"]
