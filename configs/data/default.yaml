# M1: SimBench first, WPuQ from M5.
#
# Source situation, SimBench 1.6.1: annual profiles for 2016 at 15 minutes, in
# German local time INCLUDING daylight saving time. Read naively the time axis is
# neither monotonic nor unique (four quarter-hours missing in March, four
# duplicated in October); it is converted to UTC on import.
sources:
  - name: simbench
    profiles: [load, renewables, storage]
    source_tz: Europe/Berlin
    reactive_power: true   # *_qload series are carried as their own column group
sim_dt_min: 5          # permitted: 1, 2, 5, 10 -- 15 does not divide 10 (section 6.6)
resampling:
  power: mean          # energy preserving
  energy_counter: diff
  irradiance: mean
  temperature: linear
  availability: majority
  state: last
upsampling:
  power: piecewise_constant
  irradiance: clear_sky_index
gapfill:
  max_linear_steps: 3
  fallback: previous_same_weekday
cache_dir: data/cache
