# Hydra root. The groups exist from M0 onwards; some are still empty while the
# corresponding modules are being built. Keeping the structure stable avoids
# reshuffling configurations later.
defaults:
  - grid: simbench_1-LV-rural1-future
  - data: default
  - scenario: moderate_growth
  - env: default
  - agent: null
  - baseline: null
  - _self_

seed: 1
run_dir: results/${experiment_name}/${oc.env:RUN_ID,pending}
experiment_name: smoke
