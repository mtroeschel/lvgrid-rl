# Local safeguard before committing. The concrete reason for this file: in M0 the
# CI was red because `ruff` had never been run locally -- the tests were green and
# the linter had 62 violations. These hooks run exactly the checks CI runs, only
# earlier.
#
# Setup (once per clone):
#     pip install -e ".[dev]"
#     pre-commit install
#
# Check the whole tree:
#     pre-commit run --all-files
#
# Update the hook versions:
#     pre-commit autoupdate
#
# Important: pre-commit does not replace CI. The hooks only see staged files and
# run in the developer's environment; CI checks the full tree in a fresh one.

# Deliberately no `default_language_version`: pinning to python3.11 makes the
# hooks fail on any machine that only has a newer version. Without it pre-commit
# uses the running interpreter, and `requires-python = ">=3.11"` in pyproject.toml
# covers the lower bound. The binding version check belongs in CI, not in a local
# hook.

repos:
  # --------------------------------------------------------------------- Linter
  # The version is deliberately tied to the development dependency in
  # pyproject.toml. If hook and CI drift apart on the ruff version, one reports
  # what the other lets through, which undermines trust in both.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      # Deliberately without --fix: the hook should reach the same verdict as CI
      # rather than silently changing code that is then committed unreviewed.
      - id: ruff-check
      # Note, a useful side effect: ruff-format also formats ```python blocks in
      # Markdown files, so the code sketches in docs/architecture.md stay in the
      # style of the source. Blocks that are deliberately not valid Python
      # (pseudocode) must therefore be marked ```text, not ```python.
      - id: ruff-format

  # ------------------------------------------------------------------- Hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      # Technical backstop for the data policy in data/README.md: no raw data and
      # no result artefacts in the repository. .gitignore covers the known paths,
      # this limit catches the rest.
      - id: check-added-large-files
        args: [--maxkb=500]
      # A private key committed by accident cannot be removed from a public
      # history, only rotated.
      - id: detect-private-key

  # ---------------------------------------------------------------------- Tests
  # A local hook, so the tests run in the same environment as a manual call.
  # Acceptable while the suite is fast; once pandapower and real training runs
  # make it noticeably slower it belongs under `stages: [pre-push]` instead of
  # `pre-commit`.
  - repo: local
    hooks:
      - id: pytest
        name: pytest (including open invariants)
        # The call deliberately goes through `uv run`, for two reasons.
        #
        # Not `pytest`: that script is resolved via PATH and carries its own
        # interpreter in its shebang line. If it sits outside the project
        # environment, the tests run against an interpreter that cannot see the
        # project packages.
        #
        # Not `python -m pytest` either: git hooks run with the PATH of the
        # invoking terminal, not inside the activated `.venv`. On many systems
        # there is no `python` there at all, only `python3` -- or neither, when
        # the interpreter is managed by uv. The hook then fails with
        # "Executable `python` not found".
        #
        # `uv run --frozen` solves both: it picks the project environment's
        # interpreter and keeps it at the lock file without re-resolving on every
        # commit. It requires `uv` on the PATH, which the project assumes anyway.
        #
        # The extras have to be named. `uv run` synchronises the environment only
        # for the default dependency groups, so packages belonging to an extra
        # are left at whatever version happens to be installed. A lock file
        # change to, say, simbench then has no effect and the hook tests an
        # environment that does not match the lock -- silently, until a
        # version-sensitive test fails and the cause looks like a broken patch.
        entry: uv run --frozen --extra sim --extra env python -m pytest -q -rx
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
