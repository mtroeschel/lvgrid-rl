name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -v
      # Die Zahl offener Invarianten (xfail) ist der Fortschrittsindikator des
      # Erweiterbarkeits-Contracts. Ein unerwartet gruener xfail-Test bricht den
      # Build (strict=True) und erzwingt, den Marker zu entfernen.
      - name: Offene Invarianten berichten
        run: pytest tests/test_invariants.py -q -rx
